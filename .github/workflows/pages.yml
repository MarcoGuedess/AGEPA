# Publica a tela (pasta frontend) no GitHub Pages a cada envio para o main.
# A análise com IA roda no Hugging Face Spaces (marcoguedes-agepa.hf.space).
name: Publicar tela no GitHub Pages
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deploy
        uses: actions/deploy-pages@v4
